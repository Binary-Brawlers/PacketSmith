name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (universal DMG)
    runs-on: macos-14
    timeout-minutes: 180
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain and targets
        run: |
          cargo --version
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos

      - name: Import Apple signing certificate
        if: env.APPLE_CERTIFICATE != ''
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p actions "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p actions "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k actions "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Developer ID Application/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity found in the imported certificate" >&2
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build and stage application bundle
        run: cargo xtask package --format app --arch universal --sign "${MACOS_SIGN_IDENTITY:-adhoc}"

      - name: Create DMG from the staged bundle
        run: cargo xtask package --format dmg --arch universal --skip-build

      - name: Notarize and staple DMG
        if: env.APPLE_CERTIFICATE != '' && env.APPLE_ID != '' && env.APPLE_APP_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        run: |
          DMG=$(ls target/dist/PacketSmith-*-macos-*.dmg)
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Write checksums
        run: |
          cd target/dist
          for artifact in PacketSmith-*-macos-*.dmg; do
            shasum -a 256 "$artifact" > "$artifact.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: |
            target/dist/*.dmg
            target/dist/*.dmg.sha256

  windows:
    name: Windows (x64 installer)
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows

      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis --no-progress -y
            "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Build and stage portable folder
        run: cargo xtask package --format portable --arch x64

      - name: Sign application executable
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          SIGN_TARGET: target/dist/windows/PacketSmith/PacketSmith.exe
        run: ./packaging/windows/sign.ps1 -Target $env:SIGN_TARGET

      - name: Build installer and portable zip
        run: cargo xtask package --format nsis,zip --arch x64 --skip-build

      - name: Sign installer
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          Get-ChildItem target/dist/PacketSmith-*-windows-*-setup.exe | ForEach-Object {
            ./packaging/windows/sign.ps1 -Target $_.FullName
          }

      - name: Write checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem target/dist/PacketSmith-*.exe, target/dist/PacketSmith-*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            target/dist/*-setup.exe
            target/dist/*.zip
            target/dist/*.sha256

  release:
    name: Publish GitHub release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect artifacts and write SHA256SUMS
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \) -exec cp {} release/ \;
          cd release
          find . -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \) -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
